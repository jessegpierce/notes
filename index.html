<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><title>New Note</title>
<style>
body{font:17px -apple-system,sans-serif;margin:0;padding:16px;background:#fff;color:#111}
input,textarea{width:100%;box-sizing:border-box;font:inherit;border:0;outline:0;background:none;color:inherit}
input{font-size:26px;font-weight:700;border-bottom:1px solid #ddd;padding-bottom:8px}
textarea{height:55vh;margin-top:12px;resize:none}
button{font:inherit;font-weight:600;padding:12px 24px;border:0;border-radius:10px;background:#007aff;color:#fff;margin-top:8px}
#e{background:#eee;color:#111}
#vb{white-space:pre-wrap;line-height:1.5;margin-bottom:16px}
#hint{background:#fff6d6;border-radius:10px;padding:12px;margin-bottom:16px}
@media(prefers-color-scheme:dark){body{background:#000;color:#eee}input{border-color:#333}#e{background:#333;color:#eee}#hint{background:#3a3300}}
</style></head><body>
<div id="ed"><input id="t" placeholder="Heading"><textarea id="b" placeholder="Write your note..."></textarea><button id="s">Save</button></div>
<div id="vw" hidden><div id="hint" hidden>Saved. Now tap the Share button in Safari, then "Add to Home Screen". The icon will use your heading.</div><h1 id="vt"></h1><div id="vb"></div><button id="e">Edit</button></div>
<script>
var $=function(i){return document.getElementById(i)};
function icon(t){
  var c=document.createElement('canvas');c.width=c.height=180;
  var x=c.getContext('2d');
  x.fillStyle='#f5c518';x.fillRect(0,0,180,180);
  x.fillStyle='#222';x.textAlign='center';x.textBaseline='middle';
  var w=t.split(/\s+/).slice(0,3),n=w.length,size=40;
  x.font='bold '+size+'px sans-serif';
  w.forEach(function(s){while(x.measureText(s).width>160&&size>12){size-=2;x.font='bold '+size+'px sans-serif'}});
  w.forEach(function(s,i){x.fillText(s,90,90+(i-(n-1)/2)*(size+8))});
  return c.toDataURL('image/png');
}
function show(t,b,fresh){
  document.title=t;
  var l=document.querySelector('link[rel=apple-touch-icon]');
  if(!l){l=document.createElement('link');l.rel='apple-touch-icon';document.head.appendChild(l)}
  l.href=icon(t);
  var m=document.querySelector('meta[name=apple-mobile-web-app-title]');
  if(!m){m=document.createElement('meta');m.name='apple-mobile-web-app-title';document.head.appendChild(m)}
  m.content=t.slice(0,12);
  $('vt').textContent=t;$('vb').textContent=b;
  $('hint').hidden=!fresh;
  $('ed').hidden=true;$('vw').hidden=false;
}
$('s').onclick=function(){
  var t=$('t').value.trim(),b=$('b').value;
  if(!t){$('t').focus();return}
  location.hash=encodeURIComponent(JSON.stringify([t,b]));
  show(t,b,true);
};
$('e').onclick=function(){
  $('t').value=$('vt').textContent;$('b').value=$('vb').textContent;
  document.title='New Note';
  $('vw').hidden=true;$('ed').hidden=false;
};
try{
  var h=location.hash.slice(1);
  if(h){var d=JSON.parse(decodeURIComponent(h));show(d[0],d[1],false)}
}catch(e){}
</script></body></html>
